
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login | E-comm shop</title>
    <style>
        :root {
          --primary: #59ab6e;
          --primary-dark: #488a59;
          --primary-light: #7bc18e;
          --primary-transparent: rgba(89, 171, 110, 0.1);
          --text-dark: #333333;
          --text-light: #ffffff;
          --background: #f9f9f9;
          --error: #e74c3c;
        }

        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
          font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
          background-color: var(--background);
          color: var(--text-dark);
          min-height: 100vh;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 20px;
        }

        .container {
          width: 100%;
          max-width: 400px;
          background: white;
          border-radius: 12px;
          box-shadow: 0 8px 30px rgba(0, 0, 0, 0.1);
          overflow: hidden;
          transition: transform 0.3s ease;
        }

        .container:hover {
          transform: translateY(-5px);
        }

        .header {
          background: var(--primary);
          padding: 25px 30px;
          text-align: center;
          color: var(--text-light);
          position: relative;
          overflow: hidden;
        }

        .header::before {
          content: "";
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 100%;
          background: linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.2) 0%,
            rgba(255, 255, 255, 0) 100%
          );
        }

        .header h1 {
          font-size: 28px;
          font-weight: 600;
          margin-bottom: 5px;
          position: relative;
        }

        .header p {
          font-size: 16px;
          opacity: 0.9;
          position: relative;
        }

        .form-container {
          padding: 30px;
        }

        .form-group {
          margin-bottom: 20px;
          position: relative;
        }

        .form-group label {
          display: block;
          margin-bottom: 8px;
          font-weight: 500;
          color: var(--text-dark);
          font-size: 14px;
        }

        .form-group input {
          width: 100%;
          padding: 12px 15px;
          border: 1px solid #ddd;
          border-radius: 6px;
          font-size: 15px;
          transition: all 0.3s ease;
        }

        .form-group input:focus {
          border-color: var(--primary);
          box-shadow: 0 0 0 3px var(--primary-transparent);
          outline: none;
        }

        .password-toggle {
          position: absolute;
          right: 15px;
          top: 40px;
          cursor: pointer;
          color: #777;
        }

        .password-toggle:hover {
          color: var(--primary);
        }

        .remember-forgot {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 20px;
          font-size: 14px;
        }

        .remember-me {
          display: flex;
          align-items: center;
        }

        .remember-me input {
          margin-right: 8px;
        }

        .forgot-password a {
          color: var(--primary);
          text-decoration: none;
          transition: color 0.3s ease;
        }

        .forgot-password a:hover {
          color: var(--primary-dark);
          text-decoration: underline;
        }

        .error-message {
          color: var(--error);
          font-size: 13px;
          margin-top: 5px;
          display: none;
        }

        .btn {
          width: 100%;
          padding: 14px;
          background: var(--primary);
          color: white;
          border: none;
          border-radius: 6px;
          font-size: 16px;
          font-weight: 600;
          cursor: pointer;
          transition: all 0.3s ease;
          box-shadow: 0 4px 10px rgba(89, 171, 110, 0.3);
        }

        .btn:hover {
          background: var(--primary-dark);
          transform: translateY(-2px);
          box-shadow: 0 6px 15px rgba(89, 171, 110, 0.4);
        }

        .btn:active {
          transform: translateY(0);
          box-shadow: 0 2px 5px rgba(89, 171, 110, 0.4);
        }

        .register-link {
          text-align: center;
          margin-top: 20px;
          font-size: 14px;
        }

        .register-link a {
          color: var(--primary);
          text-decoration: none;
          font-weight: 600;
          transition: color 0.3s ease;
        }

        .register-link a:hover {
          color: var(--primary-dark);
          text-decoration: underline;
        }

        .logo {
          font-size: 32px;
          font-weight: 700;
          margin-bottom: 15px;
          color: white;
        }

        @media (max-width: 480px) {
          .container {
            border-radius: 0;
            box-shadow: none;
          }

          .form-container {
            padding: 20px;
          }

          .header {
            padding: 20px;
          }

          .header h1 {
            font-size: 24px;
          }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Welcome Back</h1>
        <p>Sign in to your account</p>
    </div>
    <div class="form-container">
        <form id="login-form" method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">username</label>
                <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                />
                <div class="error-message" id="email-error"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                />
                <span class="password-toggle" id="password-toggle">👁️</span>
                <div class="error-message" id="password-error"></div>
            </div>

            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember"/>
                    <label for="remember">Remember me</label>
                </div>
                <div class="forgot-password">
                    <a href="#">Forgot password?</a>
                </div>
            </div>

            <button type="submit" class="btn">Sign In</button>
        </form>

        <div class="register-link">
            Don't have an account? <a href="{% url 'users:register' %}">Create Account</a>
        </div>
    </div>
</div>

</body>
</html>
